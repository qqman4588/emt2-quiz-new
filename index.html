<!DOCTYPE html>
<html lang="zh-TW" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>考題刷題與模擬測驗系統</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
            }
          }
        }
      }
    }
  </script>
  <!-- Marked.js -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    /* 簡易動態自訂捲軸 */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
    .dark ::-webkit-scrollbar-thumb {
      background: #475569;
    }
  </style>
</head>
<body class="bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col font-sans transition-colors duration-200">

  <!-- Header -->
  <header class="sticky top-0 z-30 bg-white/90 dark:bg-slate-800/90 backdrop-blur-md border-b border-slate-200 dark:border-slate-700 transition-colors">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <span class="text-2xl">📚</span>
        <h1 class="text-lg font-black bg-gradient-to-r from-blue-600 to-indigo-600 dark:from-blue-400 dark:to-indigo-400 bg-clip-text text-transparent">
          專業考題刷題系統
        </h1>
      </div>
      
      <!-- 功能選單與深色模式切換 -->
      <div class="flex items-center space-x-2 sm:space-x-4">
        <button id="theme-toggle-btn" onclick="toggleTheme()" class="p-2 rounded-xl bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-slate-600 dark:text-slate-300 transition-all text-sm font-bold flex items-center space-x-1.5" title="切換主題">
          <span id="theme-icon">🌙</span>
          <span id="theme-text" class="hidden sm:inline text-xs">深色模式</span>
        </button>

        <button onclick="resetAllProgress()" class="px-3 py-1.5 rounded-xl bg-rose-50 dark:bg-rose-950/40 hover:bg-rose-100 dark:hover:bg-rose-900/60 text-rose-600 dark:text-rose-400 border border-rose-200 dark:border-rose-800/50 text-xs font-bold transition-all">
          ⚠️ 重置進度
        </button>
      </div>
    </div>
  </header>

  <!-- 主內容區塊 -->
  <main class="flex-1 max-w-6xl w-full mx-auto p-4 sm:p-6 grid grid-cols-1 lg:grid-cols-4 gap-6">
    
    <!-- 左側面板：數據統計與模式選擇 -->
    <aside class="lg:col-span-1 space-y-4">
      <!-- 統計數據卡片 -->
      <div class="bg-white dark:bg-slate-800 p-4 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm space-y-3 transition-colors">
        <h2 class="text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider">學習統計</h2>
        <div class="grid grid-cols-2 gap-2 text-center">
          <div class="p-2.5 bg-slate-50 dark:bg-slate-700/50 rounded-xl">
            <span class="text-[10px] text-slate-400 dark:text-slate-400 font-bold block">已答題數</span>
            <span id="stat-answered" class="text-lg font-black text-slate-800 dark:text-slate-100">0</span>
          </div>
          <div class="p-2.5 bg-slate-50 dark:bg-slate-700/50 rounded-xl">
            <span class="text-[10px] text-slate-400 dark:text-slate-400 font-bold block">平均正確率</span>
            <span id="stat-accuracy" class="text-lg font-black text-emerald-600 dark:text-emerald-400">0%</span>
          </div>
          <div class="p-2.5 bg-slate-50 dark:bg-slate-700/50 rounded-xl">
            <span class="text-[10px] text-slate-400 dark:text-slate-400 font-bold block">錯題數量</span>
            <span id="stat-wrong" class="text-lg font-black text-rose-600 dark:text-rose-400">0</span>
          </div>
          <div class="p-2.5 bg-slate-50 dark:bg-slate-700/50 rounded-xl">
            <span class="text-[10px] text-slate-400 dark:text-slate-400 font-bold block">我的收藏</span>
            <span id="stat-bookmarks" class="text-lg font-black text-amber-500 dark:text-amber-400">0</span>
          </div>
        </div>
      </div>

      <!-- 模式選擇 -->
      <div class="bg-white dark:bg-slate-800 p-4 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm space-y-2 transition-colors">
        <h2 class="text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider mb-2">測驗模式</h2>
        
        <button onclick="switchQuizMode('sequential')" id="btn-mode-sequential" class="mode-btn w-full text-left p-3 rounded-xl text-xs sm:text-sm font-bold border transition-all flex items-center justify-between bg-blue-50 dark:bg-blue-900/30 border-blue-500 text-blue-600 dark:text-blue-400">
          <span>📖 順序刷題模式</span>
          <span class="text-[10px] bg-blue-100 dark:bg-blue-800 text-blue-700 dark:text-blue-200 px-2 py-0.5 rounded-full">預設</span>
        </button>

        <button onclick="switchQuizMode('random')" id="btn-mode-random" class="mode-btn w-full text-left p-3 rounded-xl text-xs sm:text-sm font-bold border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700/50 text-slate-600 dark:text-slate-300 transition-all flex items-center justify-between">
          <span>🔀 隨機抽題刷題</span>
        </button>

        <button onclick="switchQuizMode('wrong')" id="btn-mode-wrong" class="mode-btn w-full text-left p-3 rounded-xl text-xs sm:text-sm font-bold border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700/50 text-slate-600 dark:text-slate-300 transition-all flex items-center justify-between">
          <span>❌ 錯題複習本</span>
          <span id="badge-wrong-count" class="text-[10px] bg-rose-100 dark:bg-rose-900/50 text-rose-600 dark:text-rose-300 px-2 py-0.5 rounded-full font-black">0</span>
        </button>

        <button onclick="switchQuizMode('bookmark')" id="btn-mode-bookmark" class="mode-btn w-full text-left p-3 rounded-xl text-xs sm:text-sm font-bold border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700/50 text-slate-600 dark:text-slate-300 transition-all flex items-center justify-between">
          <span>⭐ 我的收藏題庫</span>
          <span id="badge-bookmark-count" class="text-[10px] bg-amber-100 dark:bg-amber-900/50 text-amber-600 dark:text-amber-300 px-2 py-0.5 rounded-full font-black">0</span>
        </button>

        <button onclick="switchQuizMode('mock')" id="btn-mode-mock" class="mode-btn w-full text-left p-3 rounded-xl text-xs sm:text-sm font-bold border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700/50 text-slate-600 dark:text-slate-300 transition-all flex items-center justify-between">
          <span>⏱️ 全真模擬考試</span>
        </button>

        <button onclick="switchQuizMode('all')" id="btn-mode-all" class="mode-btn w-full text-left p-3 rounded-xl text-xs sm:text-sm font-bold border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700/50 text-slate-600 dark:text-slate-300 transition-all flex items-center justify-between">
          <span>🔍 全題庫檢索瀏覽</span>
        </button>
      </div>
    </aside>

    <!-- 右側主區域：題目卡片 / 模擬考 / 全庫瀏覽 -->
    <section class="lg:col-span-3 space-y-4">

      <!-- 1. 單題練習區 -->
      <div id="quiz-single-card" class="bg-white dark:bg-slate-800 p-5 sm:p-7 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm space-y-6 transition-colors">
        <!-- 頂部資訊列 -->
        <div class="flex items-center justify-between border-b border-slate-100 dark:border-slate-700 pb-3">
          <div class="space-y-0.5">
            <span id="q-chapter" class="text-xs font-bold text-blue-600 dark:text-blue-400">載入中...</span>
            <h3 id="q-index-info" class="text-xs text-slate-400 dark:text-slate-500 font-medium">第 0 題</h3>
          </div>
          <button id="btn-bookmark-toggle" onclick="toggleCurrentBookmark()" class="p-2 rounded-xl bg-slate-100 dark:bg-slate-700 hover:bg-amber-50 dark:hover:bg-amber-950 text-slate-400 hover:text-amber-500 transition-all text-sm font-bold">
            ⭐ 收藏
          </button>
        </div>

        <!-- 題目題目敘述 -->
        <div id="q-prompt" class="text-base sm:text-lg font-bold text-slate-800 dark:text-slate-100 leading-relaxed">
          題目載入中...
        </div>

        <!-- 選項列表 -->
        <div id="q-options" class="space-y-3"></div>

        <!-- 答案與解析區 -->
        <div id="q-explanation-box" class="hidden p-4 rounded-xl bg-blue-50/80 dark:bg-blue-950/40 border border-blue-100 dark:border-blue-900/50 text-xs sm:text-sm text-slate-700 dark:text-slate-300 space-y-2">
          <div id="q-correct-ans" class="font-bold text-blue-900 dark:text-blue-300">💡 標準答案：</div>
          <div id="q-explanation" class="leading-relaxed"></div>
        </div>

        <!-- 導覽按鈕區 -->
        <div class="flex items-center justify-between border-t border-slate-100 dark:border-slate-700 pt-4">
          <button onclick="prevQuestion()" class="px-4 py-2 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 rounded-xl text-xs font-bold transition-all">
            ← 上一題
          </button>
          <span class="text-[11px] text-slate-400 dark:text-slate-500 hidden sm:inline">可使用鍵盤 [A][B][C][D] 選項 / [←][→] 換題</span>
          <button onclick="nextQuestion()" class="px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-bold shadow-sm transition-all">
            下一題 →
          </button>
        </div>
      </div>

      <!-- 2. 全真模擬考區域 -->
      <div id="mock-exam-wrapper" class="hidden space-y-4">
        <!-- 模擬考設定卡片 -->
        <div id="mock-setup-card" class="bg-white dark:bg-slate-800 p-6 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm text-center space-y-4 transition-colors">
          <div class="w-16 h-16 bg-blue-100 dark:bg-blue-950 text-blue-600 dark:text-blue-400 rounded-full flex items-center justify-center text-2xl mx-auto font-black">⏱️</div>
          <h2 class="text-xl font-bold text-slate-800 dark:text-slate-100">全真模擬測驗</h2>
          <p class="text-xs text-slate-500 dark:text-slate-400 max-w-md mx-auto">系統將隨機抽取題目組成模擬試卷，並開啟倒數計時。請在指定時間內完成所有題目並交卷。</p>
          <div class="flex justify-center gap-3 pt-2">
            <button onclick="startMockExam(20, 15)" class="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-bold shadow-md transition-all">
              🚀 開始 20 題 (15分鐘)
            </button>
            <button onclick="startMockExam(50, 45)" class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-bold shadow-md transition-all">
              🔥 開始 50 題 (45分鐘)
            </button>
          </div>
        </div>

        <!-- 考試進行卡片 -->
        <div id="mock-exam-container" class="hidden bg-white dark:bg-slate-800 p-6 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm space-y-5 transition-colors">
          <div class="flex items-center justify-between border-b border-slate-100 dark:border-slate-700 pb-3">
            <span id="mock-exam-info" class="text-xs font-bold text-blue-600 dark:text-blue-400">模擬考進行中</span>
            <div class="flex items-center space-x-3">
              <span id="mock-timer" class="text-sm font-black text-rose-600 dark:text-rose-400 font-mono bg-rose-50 dark:bg-rose-950/50 px-3 py-1 rounded-lg border border-rose-200 dark:border-rose-800">00:00</span>
              <button onclick="submitMockExam()" class="px-3 py-1 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-xs font-bold transition-all">
                📥 立即交卷
              </button>
            </div>
          </div>
          <div id="mock-q-body"></div>
        </div>

        <!-- 考試結果診斷卡片 -->
        <div id="mock-result-card" class="hidden bg-white dark:bg-slate-800 p-6 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm transition-colors"></div>
      </div>

      <!-- 3. 全題庫檢索瀏覽區 -->
      <div id="all-questions-wrapper" class="hidden space-y-4">
        <div class="bg-white dark:bg-slate-800 p-4 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm space-y-3 transition-colors">
          <div class="flex flex-col sm:flex-row gap-2 justify-between items-center">
            <input type="text" id="all-search-input" oninput="handleAllQuestionsSearch(this.value)" placeholder="🔍 搜尋關鍵字、章節或題目內容..." class="w-full sm:w-80 px-3.5 py-2 text-xs rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 focus:outline-none focus:border-blue-500">
            <button id="btn-toggle-all-ans" onclick="toggleAllAnswersVisibility()" class="w-full sm:w-auto px-4 py-2 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 rounded-xl text-xs font-bold transition-all">
              👁️ 展開答案與解析
            </button>
          </div>
        </div>
        <div id="all-questions-list" class="space-y-3"></div>
      </div>

      <!-- 答題題號快速導覽面板 -->
      <div id="palette-card" class="bg-white dark:bg-slate-800 p-4 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm space-y-2 transition-colors">
        <h4 class="text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider">答題快速導覽</h4>
        <div id="palette-grid" class="flex flex-wrap gap-1.5 max-h-36 overflow-y-auto p-1"></div>
      </div>

    </section>
  </main>

  <script>
    // ==========================================
    // 預設測驗範例資料庫
    // ==========================================
    const mockDb = [
      {
        global_id: 1,
        id: 1,
        chapter_title: "第一章：基礎概念",
        prompt: "下列關於網頁前端開發的敘述，何者正確？",
        options: [
          "(A) HTML 主要負責網頁的樣式與視覺效果",
          "(B) CSS 主要負責網頁的結構與內容",
          "(C) JavaScript 主要負責網頁的互動行為與動態邏輯",
          "(D) Tailwind CSS 是一種 JavaScript 前端框架"
        ],
        answer: "C",
        explanation: "HTML 負責網頁結構，CSS 負責外觀視覺樣式，JavaScript 負責動態行為與互動邏輯；Tailwind CSS 為 CSS 框架。"
      },
      {
        global_id: 2,
        id: 2,
        chapter_title: "第一章：基礎概念",
        prompt: "在 CSS 中，設定 `display: flex` 的主要目的為何？",
        options: [
          "(A) 將元素轉換為 3D 繪圖模式",
          "(B) 開啟彈性盒模型版面配置 (Flexbox Layout)",
          "(C) 讓元素自動隱藏",
          "(D) 直接更改網頁字體"
        ],
        answer: "B",
        explanation: "`display: flex` 能啟動 Flexbox 彈性盒版面，利於進行一維空間的對齊與彈性分配。"
      },
      {
        global_id: 3,
        id: 3,
        chapter_title: "第二章：JavaScript 核心",
        prompt: "關於 `localStorage` 的特性，下列何者正確？",
        options: [
          "(A) 關閉瀏覽器分頁後資料會自動清除",
          "(B) 儲存的資料會隨著 HTTP 請求自動發送到伺服器",
          "(C) 資料會持續儲存在客戶端瀏覽器中，直到主動清除",
          "(D) 只能儲存 ArrayBuffer 格式"
        ],
        answer: "C",
        explanation: "`localStorage` 為持久化本機儲存，不會隨關閉分頁而消失，亦不會隨請求傳送至伺服器。"
      }
    ];

    // 全域變數狀態
    let questionsData = mockDb;
    let currentQuizMode = 'sequential'; // 'sequential', 'random', 'wrong', 'bookmark', 'mock', 'all'
    let currentFilteredQuestions = [...questionsData];
    let currentIndexInFiltered = 0;

    let userAnswers = {}; // { global_id: 'A' }
    let wrongAnswers = new Set(); // Set of global_id
    let bookmarkedQuestions = new Set(); // Set of global_id

    let allAnswersVisible = false;

    // 模擬考專用變數
    let mockExamQuestions = [];
    let mockExamAnswers = {};
    let currentQuestionIndex = 0;
    let mockTimeRemaining = 0;
    let mockTimerInterval = null;

    let currentTab = 'quiz';

    // ==========================================
    // 深色 / 淺色主題切換邏輯 (Theme Toggle)
    // ==========================================
    function initTheme() {
      const savedTheme = localStorage.getItem('app_theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

      if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
        document.documentElement.classList.add('dark');
        updateThemeUI(true);
      } else {
        document.documentElement.classList.remove('dark');
        updateThemeUI(false);
      }
    }

    function toggleTheme() {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.setItem('app_theme', isDark ? 'dark' : 'light');
      updateThemeUI(isDark);
    }

    function updateThemeUI(isDark) {
      const iconEl = document.getElementById('theme-icon');
      const textEl = document.getElementById('theme-text');
      if (iconEl) iconEl.textContent = isDark ? '☀️' : '🌙';
      if (textEl) textEl.textContent = isDark ? '淺色模式' : '深色模式';
    }

    // ==========================================
    // 初始化與資料載入
    // ==========================================
    window.addEventListener('DOMContentLoaded', () => {
      initTheme();
      loadUserData();
      updateFilteredQuestions();
      renderSingleQuestionCard();
      renderPaletteGrid();
      updateStatsUI();
    });

    function loadUserData() {
      try {
        const localAns = localStorage.getItem('quiz_user_answers');
        if (localAns) userAnswers = JSON.parse(localAns);

        const localWrong = localStorage.getItem('quiz_wrong_answers');
        if (localWrong) wrongAnswers = new Set(JSON.parse(localWrong));

        const localBm = localStorage.getItem('quiz_bookmarks');
        if (localBm) bookmarkedQuestions = new Set(JSON.parse(localBm));
      } catch (e) {
        console.error("載入本機紀錄失敗", e);
      }
    }

    function saveUserData() {
      try {
        localStorage.setItem('quiz_user_answers', JSON.stringify(userAnswers));
        localStorage.setItem('quiz_wrong_answers', JSON.stringify([...wrongAnswers]));
        localStorage.setItem('quiz_bookmarks', JSON.stringify([...bookmarkedQuestions]));
      } catch (e) {
        console.error("儲存本機紀錄失敗", e);
      }
    }

    function safeRenderMarkdown(text) {
      if (!text) return '';
      return typeof marked !== 'undefined' ? marked.parse(text) : text;
    }

    function setElText(id, text) {
      const el = document.getElementById(id);
      if (el) el.textContent = text;
    }

    // ==========================================
    // 測驗模式切換機制
    // ==========================================
    function switchQuizMode(mode) {
      currentQuizMode = mode;
      
      // 更新按鈕樣式
      document.querySelectorAll('.mode-btn').forEach(btn => {
        btn.className = "mode-btn w-full text-left p-3 rounded-xl text-xs sm:text-sm font-bold border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700/50 text-slate-600 dark:text-slate-300 transition-all flex items-center justify-between";
      });

      const activeBtn = document.getElementById(`btn-mode-${mode}`);
      if (activeBtn) {
        activeBtn.className = "mode-btn w-full text-left p-3 rounded-xl text-xs sm:text-sm font-bold border transition-all flex items-center justify-between bg-blue-50 dark:bg-blue-900/30 border-blue-500 text-blue-600 dark:text-blue-400";
      }

      // 控制顯示面板
      const singleCard = document.getElementById('quiz-single-card');
      const paletteCard = document.getElementById('palette-card');
      const mockWrapper = document.getElementById('mock-exam-wrapper');
      const allWrapper = document.getElementById('all-questions-wrapper');

      singleCard.classList.add('hidden');
      paletteCard.classList.add('hidden');
      mockWrapper.classList.add('hidden');
      allWrapper.classList.add('hidden');

      if (mode === 'mock') {
        mockWrapper.classList.remove('hidden');
        showMockSetupView();
      } else if (mode === 'all') {
        allWrapper.classList.remove('hidden');
        renderAllQuestionsList();
      } else {
        singleCard.classList.remove('hidden');
        paletteCard.classList.remove('hidden');
        updateFilteredQuestions();
        currentIndexInFiltered = 0;
        renderSingleQuestionCard();
        renderPaletteGrid();
      }
    }

    function updateFilteredQuestions() {
      if (currentQuizMode === 'sequential') {
        currentFilteredQuestions = [...questionsData];
      } else if (currentQuizMode === 'random') {
        reshuffleRandomQuestions(false);
      } else if (currentQuizMode === 'wrong') {
        currentFilteredQuestions = questionsData.filter(q => wrongAnswers.has(q.global_id));
      } else if (currentQuizMode === 'bookmark') {
        currentFilteredQuestions = questionsData.filter(q => bookmarkedQuestions.has(q.global_id));
      }
    }

    function reshuffleRandomQuestions(force = true) {
      if (force || !currentFilteredQuestions.length) {
        currentFilteredQuestions = [...questionsData].sort(() => 0.5 - Math.random());
      }
    }

    // ==========================================
    // 單題渲染與互動邏輯
    // ==========================================
    function renderSingleQuestionCard() {
      const q = currentFilteredQuestions[currentIndexInFiltered];

      if (!q) {
        setElText('q-chapter', '無題目');
        setElText('q-index-info', '0 / 0');
        setElText('q-prompt', currentQuizMode === 'wrong' ? '🎉 太棒了！目前沒有任何錯題！' : (currentQuizMode === 'bookmark' ? '⭐ 目前尚未收藏任何題目！' : '目前尚無題目資料。'));
        document.getElementById('q-options').innerHTML = '';
        document.getElementById('q-explanation-box').classList.add('hidden');
        return;
      }

      setElText('q-chapter', q.chapter_title || '未分類');
      setElText('q-index-info', `第 ${currentIndexInFiltered + 1} 題 / 共 ${currentFilteredQuestions.length} 題 (#${q.global_id})`);
      setElText('q-prompt', q.prompt);

      // 書籤狀態
      const isBookmarked = bookmarkedQuestions.has(q.global_id);
      const bmBtn = document.getElementById('btn-bookmark-toggle');
      if (bmBtn) {
        bmBtn.className = isBookmarked 
          ? "p-2 rounded-xl bg-amber-100 dark:bg-amber-950/80 text-amber-600 dark:text-amber-400 font-bold transition-all text-sm" 
          : "p-2 rounded-xl bg-slate-100 dark:bg-slate-700 text-slate-400 hover:text-amber-500 font-bold transition-all text-sm";
      }

      // 渲染選項
      const userChoice = userAnswers[q.global_id];
      const container = document.getElementById('q-options');
      container.innerHTML = '';

      (q.options || []).forEach(opt => {
        const optLetter = opt.substring(1, 2);
        const isSelected = userChoice === optLetter;
        const isCorrect = optLetter === q.answer;

        let btnStyle = "bg-white dark:bg-slate-800 border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700/50 text-slate-800 dark:text-slate-200";

        if (userChoice) {
          if (isCorrect) {
            btnStyle = "bg-emerald-50 dark:bg-emerald-950/50 border-emerald-500 text-emerald-900 dark:text-emerald-300 font-bold";
          } else if (isSelected) {
            btnStyle = "bg-rose-50 dark:bg-rose-950/50 border-rose-500 text-rose-900 dark:text-rose-300 line-through";
          }
        }

        const btn = document.createElement('button');
        btn.onclick = () => handleSelectOption(optLetter);
        btn.className = `opt-btn w-full text-left p-3.5 rounded-xl text-xs sm:text-base border transition-all flex items-start space-x-3 ${btnStyle}`;
        btn.innerHTML = `
          <span class="w-6 h-6 rounded-lg bg-slate-100 dark:bg-slate-700 flex items-center justify-center font-bold text-xs flex-shrink-0 mt-0.5">${optLetter}</span>
          <span class="flex-1 leading-relaxed">${opt.replace(/^\([A-D]\)\s*/, '')}</span>
        `;
        container.appendChild(btn);
      });

      // 解析顯示
      const expBox = document.getElementById('q-explanation-box');
      if (userChoice) {
        expBox.classList.remove('hidden');
        setElText('q-correct-ans', `💡 標準答案：(${q.answer})`);
        document.getElementById('q-explanation').innerHTML = safeRenderMarkdown(q.explanation || '暫無詳細解析');
      } else {
        expBox.classList.add('hidden');
      }

      renderPaletteGrid();
    }

    function handleSelectOption(optLetter) {
      const q = currentFilteredQuestions[currentIndexInFiltered];
      if (!q) return;

      userAnswers[q.global_id] = optLetter;

      if (optLetter === q.answer) {
        wrongAnswers.delete(q.global_id);
      } else {
        wrongAnswers.add(q.global_id);
      }

      saveUserData();
      updateStatsUI();
      renderSingleQuestionCard();
    }

    function toggleCurrentBookmark() {
      const q = currentFilteredQuestions[currentIndexInFiltered];
      if (!q) return;

      if (bookmarkedQuestions.has(q.global_id)) {
        bookmarkedQuestions.delete(q.global_id);
      } else {
        bookmarkedQuestions.add(q.global_id);
      }

      saveUserData();
      updateStatsUI();
      renderSingleQuestionCard();
    }

    function prevQuestion() {
      if (currentIndexInFiltered > 0) {
        currentIndexInFiltered--;
        renderSingleQuestionCard();
      }
    }

    function nextQuestion() {
      if (currentIndexInFiltered < currentFilteredQuestions.length - 1) {
        currentIndexInFiltered++;
        renderSingleQuestionCard();
      }
    }

    function renderPaletteGrid() {
      const grid = document.getElementById('palette-grid');
      if (!grid) return;
      grid.innerHTML = '';

      currentFilteredQuestions.forEach((q, idx) => {
        const userChoice = userAnswers[q.global_id];
        let statusStyle = "bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300";

        if (userChoice) {
          if (userChoice === q.answer) {
            statusStyle = "bg-emerald-500 text-white font-bold";
          } else {
            statusStyle = "bg-rose-500 text-white font-bold";
          }
        }

        if (idx === currentIndexInFiltered) {
          statusStyle += " ring-2 ring-blue-500 ring-offset-2 dark:ring-offset-slate-800";
        }

        const btn = document.createElement('button');
        btn.onclick = () => {
          currentIndexInFiltered = idx;
          renderSingleQuestionCard();
        };
        btn.className = `w-7 h-7 rounded-lg text-xs flex items-center justify-center transition-all ${statusStyle}`;
        btn.textContent = idx + 1;
        grid.appendChild(btn);
      });
    }

    // ==========================================
    // ALL QUESTIONS LIST (全題庫檢索)
    // ==========================================
    function renderAllQuestionsList(searchFilter = '') {
      const listEl = document.getElementById('all-questions-list');
      if (!listEl) return;
      listEl.innerHTML = '';

      let filtered = [...questionsData];

      if (searchFilter) {
        const query = searchFilter.toLowerCase();
        filtered = questionsData.filter(q => 
          q.prompt.toLowerCase().includes(query) ||
          q.chapter_title.toLowerCase().includes(query) ||
          (q.options && q.options.some(opt => opt.toLowerCase().includes(query)))
        );
      }

      if (filtered.length === 0) {
        listEl.innerHTML = `
          <div class="text-center py-12 text-slate-400 dark:text-slate-500">
            <span class="text-3xl block mb-2">🔍</span>
            <p class="text-sm font-semibold">未找到符合「${searchFilter}」的題目</p>
          </div>
        `;
        return;
      }

      const renderLimit = Math.min(filtered.length, 100);

      for (let i = 0; i < renderLimit; i++) {
        const q = filtered[i];
        const userChoice = userAnswers[q.global_id];
        const item = document.createElement('div');
        item.className = 'p-4 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 space-y-3 transition-colors';

        let optionsHtml = (q.options || []).map(opt => {
          const optLetter = opt.substring(1, 2);
          let isCorrect = optLetter === q.answer;
          let isUserChoice = optLetter === userChoice;
          
          let optStyle = 'bg-slate-50 dark:bg-slate-700/50 border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-300';
          if (allAnswersVisible || userChoice) {
            if (isCorrect) optStyle = 'bg-emerald-50 dark:bg-emerald-950/50 border-emerald-500 text-emerald-900 dark:text-emerald-300 font-bold';
            else if (isUserChoice) optStyle = 'bg-rose-50 dark:bg-rose-950/50 border-rose-500 text-rose-900 dark:text-rose-300 line-through';
          }

          return `
            <div class="p-2.5 rounded-lg border text-xs sm:text-sm ${optStyle} flex items-start space-x-2">
              <span class="font-bold flex-shrink-0">${optLetter}.</span>
              <span>${opt.replace(/^\([A-D]\)\s*/, '')}</span>
            </div>
          `;
        }).join('');

        item.innerHTML = `
          <div class="flex items-center justify-between text-xs text-slate-400 dark:text-slate-500 border-b border-slate-100 dark:border-slate-700 pb-2">
            <span class="font-bold text-blue-600 dark:text-blue-400">${q.chapter_title}</span>
            <span>第 ${q.id} 題 (#${q.global_id})</span>
          </div>
          <div class="text-sm sm:text-base font-bold text-slate-800 dark:text-slate-100 leading-relaxed">${q.prompt}</div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">${optionsHtml}</div>
          ${(allAnswersVisible || userChoice) ? `
            <div class="p-3 bg-blue-50/80 dark:bg-blue-950/40 rounded-lg text-xs text-slate-700 dark:text-slate-300 border border-blue-100 dark:border-blue-900/50 mt-2">
              <div class="font-bold text-blue-900 dark:text-blue-300 mb-1">💡 標準答案：(${q.answer})</div>
              <div>${safeRenderMarkdown(q.explanation || '暫無解析')}</div>
            </div>
          ` : ''}
        `;
        listEl.appendChild(item);
      }

      if (filtered.length > 100) {
        const tip = document.createElement('div');
        tip.className = 'text-center py-4 text-xs text-slate-400 dark:text-slate-500 font-medium';
        tip.textContent = `已顯示前 100 筆結果（共 ${filtered.length} 筆），請輸入關鍵字縮小搜尋範圍。`;
        listEl.appendChild(tip);
      }
    }

    function handleAllQuestionsSearch(val) {
      renderAllQuestionsList(val);
    }

    function toggleAllAnswersVisibility() {
      allAnswersVisible = !allAnswersVisible;
      const btn = document.getElementById('btn-toggle-all-ans');
      if (btn) {
        btn.textContent = allAnswersVisible ? '🙈 隱藏解析' : '👁️ 展開解析';
      }
      const searchVal = document.getElementById('all-search-input')?.value || '';
      renderAllQuestionsList(searchVal);
    }

    // ==========================================
    // MOCK EXAM MODE (模擬考)
    // ==========================================
    function showMockSetupView() {
      const setup = document.getElementById('mock-setup-card');
      const exam = document.getElementById('mock-exam-container');
      const result = document.getElementById('mock-result-card');

      if (setup) setup.classList.remove('hidden');
      if (exam) exam.classList.add('hidden');
      if (result) result.classList.add('hidden');
    }

    function startMockExam(questionCount, timeLimitMinutes) {
      if (!questionsData || questionsData.length === 0) return;

      mockExamQuestions = [...questionsData].sort(() => 0.5 - Math.random()).slice(0, questionCount);
      mockExamAnswers = {};
      currentQuestionIndex = 0;
      mockTimeRemaining = timeLimitMinutes * 60;

      const setup = document.getElementById('mock-setup-card');
      const exam = document.getElementById('mock-exam-container');
      const result = document.getElementById('mock-result-card');

      if (setup) setup.classList.add('hidden');
      if (exam) exam.classList.remove('hidden');
      if (result) result.classList.add('hidden');

      setElText('mock-exam-info', `模擬考 (${questionCount} 題)`);
      startMockTimer();
      renderMockQuestion();
    }

    function startMockTimer() {
      if (mockTimerInterval) clearInterval(mockTimerInterval);
      
      const updateTimerUI = () => {
        const mins = Math.floor(mockTimeRemaining / 60);
        const secs = mockTimeRemaining % 60;
        setElText('mock-timer', `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`);
        
        if (mockTimeRemaining <= 0) {
          clearInterval(mockTimerInterval);
          alert("⏰ 考試時間到！系統已為您自動交卷。");
          submitMockExam();
        }
        mockTimeRemaining--;
      };

      updateTimerUI();
      mockTimerInterval = setInterval(updateTimerUI, 1000);
    }

    function renderMockQuestion() {
      const container = document.getElementById('mock-q-body');
      if (!container) return;

      const q = mockExamQuestions[currentQuestionIndex];
      if (!q) return;

      const userChoice = mockExamAnswers[q.global_id];

      let optionsHtml = (q.options || []).map(opt => {
        const optLetter = opt.substring(1, 2);
        const isSelected = userChoice === optLetter;

        return `
          <button onclick="selectMockOption('${optLetter}')" 
            class="opt-btn w-full text-left p-3.5 rounded-xl text-xs sm:text-base font-semibold border transition-all flex items-start space-x-3 ${
              isSelected 
                ? 'bg-blue-600 text-white border-blue-600 shadow-sm' 
                : 'bg-white dark:bg-slate-800 border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-700/50 text-slate-800 dark:text-slate-100'
            }">
            <span class="w-6 h-6 rounded-lg ${isSelected ? 'bg-white text-blue-600' : 'bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-300'} flex items-center justify-center font-bold text-xs flex-shrink-0 mt-0.5">
              ${optLetter}
            </span>
            <span class="flex-1 leading-relaxed">${opt.replace(/^\([A-D]\)\s*/, '')}</span>
          </button>
        `;
      }).join('');

      container.innerHTML = `
        <div class="flex items-center justify-between text-xs text-slate-400 dark:text-slate-500 border-b border-slate-200 dark:border-slate-700 pb-2 mb-3">
          <span class="font-bold text-blue-600 dark:text-blue-400">${q.chapter_title}</span>
          <span>第 ${currentQuestionIndex + 1} 題 / 共 ${mockExamQuestions.length} 題</span>
        </div>
        <div class="text-base sm:text-lg font-bold text-slate-900 dark:text-slate-100 leading-relaxed mb-5">${q.prompt}</div>
        <div class="space-y-2.5 mb-6">${optionsHtml}</div>
        <div class="flex items-center justify-between border-t border-slate-200 dark:border-slate-700 pt-4">
          <button onclick="prevMockQuestion()" ${currentQuestionIndex === 0 ? 'disabled class="opacity-40 cursor-not-allowed px-3 py-1.5 bg-slate-200 dark:bg-slate-700 text-slate-500 dark:text-slate-400 rounded-lg text-xs font-bold"' : 'class="px-3.5 py-1.5 bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 dark:hover:bg-slate-600 text-slate-800 dark:text-slate-200 rounded-lg text-xs font-bold"'}>
            ← 上一題
          </button>
          <button onclick="nextMockQuestion()" ${currentQuestionIndex === mockExamQuestions.length - 1 ? 'disabled class="opacity-40 cursor-not-allowed px-3 py-1.5 bg-slate-200 dark:bg-slate-700 text-slate-500 dark:text-slate-400 rounded-lg text-xs font-bold"' : 'class="px-4 py-1.5 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-xs font-bold"'}>
            下一題 →
          </button>
        </div>
      `;
    }

    function selectMockOption(optLetter) {
      const q = mockExamQuestions[currentQuestionIndex];
      if (!q) return;
      mockExamAnswers[q.global_id] = optLetter;
      renderMockQuestion();
    }

    function prevMockQuestion() {
      if (currentQuestionIndex > 0) {
        currentQuestionIndex--;
        renderMockQuestion();
      }
    }

    function nextMockQuestion() {
      if (currentQuestionIndex < mockExamQuestions.length - 1) {
        currentQuestionIndex++;
        renderMockQuestion();
      }
    }

    function submitMockExam() {
      if (mockTimerInterval) clearInterval(mockTimerInterval);

      let correctCount = 0;
      mockExamQuestions.forEach(q => {
        const userChoice = mockExamAnswers[q.global_id];
        if (userChoice === q.answer) {
          correctCount++;
        } else if (userChoice) {
          wrongAnswers.add(q.global_id);
        }
      });

      saveUserData();

      const score = Math.round((correctCount / mockExamQuestions.length) * 100);
      const isPassed = score >= 60;

      const exam = document.getElementById('mock-exam-container');
      const result = document.getElementById('mock-result-card');

      if (exam) exam.classList.add('hidden');
      if (result) {
        result.classList.remove('hidden');
        result.classList.add('flex');

        result.innerHTML = `
          <div class="max-w-md mx-auto w-full text-center py-6">
            <div class="w-20 h-20 rounded-full ${isPassed ? 'bg-emerald-100 dark:bg-emerald-950 text-emerald-600 dark:text-emerald-400' : 'bg-rose-100 dark:bg-rose-950 text-rose-600 dark:text-rose-400'} text-4xl flex items-center justify-center mx-auto mb-4 font-black">
              ${isPassed ? '🎉' : '💀'}
            </div>
            <h2 class="text-2xl sm:text-3xl font-black text-slate-900 dark:text-slate-100 mb-1">${isPassed ? '測驗合格！' : '需要再接再厲！'}</h2>
            <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400 mb-6">${isPassed ? '恭喜達到及格標準，持續保持刷題感覺！' : '成績未達 60 分及格線，建議加強錯題與章節重點觀念。'}</p>

            <div class="bg-slate-50 dark:bg-slate-700/40 p-4 rounded-2xl border border-slate-200 dark:border-slate-700 mb-6 grid grid-cols-3 gap-2 text-center">
              <div>
                <span class="text-[10px] text-slate-400 dark:text-slate-400 block font-bold">總得分</span>
                <span class="text-xl sm:text-2xl font-black ${isPassed ? 'text-emerald-600 dark:text-emerald-400' : 'text-rose-600 dark:text-rose-400'}">${score}</span>
                <span class="text-[10px] text-slate-400">分</span>
              </div>
              <div>
                <span class="text-[10px] text-slate-400 dark:text-slate-400 block font-bold">答對題數</span>
                <span class="text-xl sm:text-2xl font-black text-blue-600 dark:text-blue-400">${correctCount}</span>
                <span class="text-[10px] text-slate-400">/${mockExamQuestions.length}</span>
              </div>
              <div>
                <span class="text-[10px] text-slate-400 dark:text-slate-400 block font-bold">正確率</span>
                <span class="text-xl sm:text-2xl font-black text-indigo-600 dark:text-indigo-400">${score}%</span>
              </div>
            </div>

            <div class="space-y-2">
              <button onclick="showMockSetupView()" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-bold text-sm shadow-md transition-all">
                🔄 再測驗一次
              </button>
              <button onclick="switchQuizMode('wrong')" class="w-full py-2.5 bg-rose-50 dark:bg-rose-950/40 hover:bg-rose-100 dark:hover:bg-rose-900/60 text-rose-700 dark:text-rose-300 rounded-xl font-bold text-xs transition-all border border-rose-200 dark:border-rose-800/50">
                ❌ 查看錯題本加強
              </button>
            </div>
          </div>
        `;
      }
    }

    // ==========================================
    // UTILS & STATS UI
    // ==========================================
    function updateStatsUI() {
      const totalAnswered = Object.keys(userAnswers).length;
      let correctCount = 0;

      questionsData.forEach(q => {
        if (userAnswers[q.global_id] === q.answer) {
          correctCount++;
        }
      });

      const accuracy = totalAnswered > 0 ? Math.round((correctCount / totalAnswered) * 100) : 0;

      setElText('stat-answered', totalAnswered);
      setElText('stat-accuracy', `${accuracy}%`);
      setElText('stat-bookmarks', bookmarkedQuestions.size);
      setElText('stat-wrong', wrongAnswers.size);

      setElText('badge-wrong-count', wrongAnswers.size);
      setElText('badge-bookmark-count', bookmarkedQuestions.size);
    }

    function resetAllProgress() {
      if (confirm("⚠️ 確定要重置所有做題紀錄、錯題本與收藏本嗎？此操作無法復原！")) {
        userAnswers = {};
        wrongAnswers.clear();
        bookmarkedQuestions.clear();
        saveUserData();
        reshuffleRandomQuestions(false);
        renderSingleQuestionCard();
        renderPaletteGrid();
        updateStatsUI();
        alert("✨ 所有答題紀錄已順利重置！");
      }
    }

    // Keyboard Shortcuts
    document.addEventListener('keydown', (e) => {
      if (currentTab !== 'quiz' || currentQuizMode === 'all' || currentQuizMode === 'mock') return;
      if (['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName)) return;

      const key = e.key.toUpperCase();
      if (['A', 'B', 'C', 'D'].includes(key)) {
        handleSelectOption(key);
      } else if (e.key === 'ArrowLeft') {
        prevQuestion();
      } else if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'Enter') {
        e.preventDefault();
        nextQuestion();
      }
    });
  </script>
</body>
</html>

  <script>
    // ==========================================
    // THEME MANAGEMENT (Dark / Light Mode)
    // ==========================================
    function initTheme() {
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
        document.documentElement.classList.remove('light');
        document.getElementById('theme-toggle-light-icon').classList.remove('hidden');
        document.getElementById('theme-toggle-dark-icon').classList.add('hidden');
      } else {
        document.documentElement.classList.add('light');
        document.documentElement.classList.remove('dark');
        document.getElementById('theme-toggle-dark-icon').classList.remove('hidden');
        document.getElementById('theme-toggle-light-icon').classList.add('hidden');
      }
    }

    function toggleDarkMode() {
      const isDark = document.documentElement.classList.contains('dark');
      if (isDark) {
        document.documentElement.classList.remove('dark');
        document.documentElement.classList.add('light');
        localStorage.setItem('theme', 'light');
        document.getElementById('theme-toggle-dark-icon').classList.remove('hidden');
        document.getElementById('theme-toggle-light-icon').classList.add('hidden');
      } else {
        document.documentElement.classList.add('dark');
        document.documentElement.classList.remove('light');
        localStorage.setItem('theme', 'dark');
        document.getElementById('theme-toggle-light-icon').classList.remove('hidden');
        document.getElementById('theme-toggle-dark-icon').classList.add('hidden');
      }
    }

    // Call initTheme early

      {

      },
      {
        global_id: 15,
        category: "立法院組織法",
        question: "立法院黨團之組成，每黨團至少須有立法委員幾人以上？",
        options: { A: "2人", B: "3人", C: "5人", D: "7人" },

    // ==========================================
    // APP STATE MANAGEMENT
    // ==========================================
    let currentTab = 'quiz'; // 'quiz' | 'mock'
    let currentQuizMode = 'random'; // 'random' | 'chapter' | 'wrong' | 'bookmarks'
    let currentSelectedChapter = '';

    // Active Active Display Items Array
    let activeQuestions = [];
    let activeIndex = 0;

    // Persistent User Data (LocalStorage)
    let userAnswers = {}; // { [global_id]: 'A'|'B'|'C'|'D' }
    let wrongAnswers = new Set(); // Set of global_ids
    let bookmarkedQuestions = new Set(); // Set of global_ids

    // Mock Exam State
    let mockExamQuestions = [];
    let mockExamAnswers = {};
    let mockTimerInterval = null;
    let mockTimeRemaining = 20 * 60; // 20 mins

    // ==========================================
    // INITIALIZATION & LOCALSTORAGE
    // ==========================================
    document.addEventListener('DOMContentLoaded', () => {
      loadUserData();
      populateChapterOptions();
      switchQuizMode('random');
      updateStatsUI();
    });

    function loadUserData() {
      try {
        const localAns = localStorage.getItem('gov_user_answers');
        if (localAns) userAnswers = JSON.parse(localAns);

        const localWrong = localStorage.getItem('gov_wrong_answers');
        if (localWrong) wrongAnswers = new Set(JSON.parse(localWrong));

        const localBm = localStorage.getItem('gov_bookmarks');
        if (localBm) bookmarkedQuestions = new Set(JSON.parse(localBm));
      } catch (e) {
        console.error("Failed to load local state", e);
      }
    }

    function saveUserData() {
      try {
        localStorage.setItem('gov_user_answers', JSON.stringify(userAnswers));
        localStorage.setItem('gov_wrong_answers', JSON.stringify(Array.from(wrongAnswers)));
        localStorage.setItem('gov_bookmarks', JSON.stringify(Array.from(bookmarkedQuestions)));
      } catch (e) {
        console.error("Failed to save local state", e);
      }
    }

    // Helper Utility
    function setElText(id, text) {
      const el = document.getElementById(id);
      if (el) el.innerText = text;
    }

    // ==========================================
    // NAVIGATION TABS SWITCHING
    // ==========================================
    function switchTab(tabName) {
      currentTab = tabName;
      const qBtn = document.getElementById('tab-btn-quiz');
      const mBtn = document.getElementById('tab-btn-mock');
      const quizFilter = document.getElementById('quiz-filter-container');
      const quizView = document.getElementById('view-quiz-card');
      const mockView = document.getElementById('view-mock-container');
      const paletteCard = document.getElementById('palette-card');

      if (tabName === 'quiz') {
        qBtn.className = "px-3 py-1.5 text-xs sm:text-sm font-semibold rounded-lg bg-white dark:bg-slate-600 text-slate-800 dark:text-white shadow-sm transition-all";
        mBtn.className = "px-3 py-1.5 text-xs sm:text-sm font-semibold rounded-lg text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 transition-all";
        
        quizFilter.classList.remove('hidden');
        quizView.classList.remove('hidden');
        paletteCard.classList.remove('hidden');
        mockView.classList.add('hidden');
      } else {
        mBtn.className = "px-3 py-1.5 text-xs sm:text-sm font-semibold rounded-lg bg-white dark:bg-slate-600 text-slate-800 dark:text-white shadow-sm transition-all";
        qBtn.className = "px-3 py-1.5 text-xs sm:text-sm font-semibold rounded-lg text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 transition-all";

        quizFilter.classList.add('hidden');
        quizView.classList.add('hidden');
        paletteCard.classList.add('hidden');
        mockView.classList.remove('hidden');
      }
    }

    // ==========================================
    // QUIZ MODES & FILTERING
    // ==========================================
    function populateChapterOptions() {
      const chapters = [...new Set(questionsData.map(q => q.category))];
      const selectEl = document.getElementById('chapter-select');
      selectEl.innerHTML = chapters.map(c => `<option value="${c}">${c}</option>`).join('');
      if (chapters.length > 0) currentSelectedChapter = chapters[0];
    }

    function switchQuizMode(mode) {
      currentQuizMode = mode;

      // Update Button Styles
      const btnModes = ['random', 'chapter', 'wrong', 'bookmarks'];
      btnModes.forEach(m => {
        const btn = document.getElementById(`mode-btn-${m}`);
        if (m === mode) {
          btn.className = "px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold bg-brand-500 text-white shadow-sm transition-all flex items-center gap-1.5";
        } else {
          btn.className = "px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-600 transition-all flex items-center gap-1.5";
        }
      });

      const chapterSelectWrapper = document.getElementById('chapter-select-wrapper');
      if (mode === 'chapter') {
        chapterSelectWrapper.classList.remove('hidden');
      } else {
        chapterSelectWrapper.classList.add('hidden');
      }

      // Load filtered question list
      if (mode === 'random') {
        reshuffleRandomQuestions(false);
      } else if (mode === 'chapter') {
        activeQuestions = questionsData.filter(q => q.category === currentSelectedChapter);
        activeIndex = 0;
      } else if (mode === 'wrong') {
        activeQuestions = questionsData.filter(q => wrongAnswers.has(q.global_id));
        activeIndex = 0;
      } else if (mode === 'bookmarks') {
        activeQuestions = questionsData.filter(q => bookmarkedQuestions.has(q.global_id));
        activeIndex = 0;
      }

      renderSingleQuestionCard();
      renderPaletteGrid();
      updateStatsUI();
    }

    function reshuffleRandomQuestions(shuffle = true) {
      activeQuestions = [...questionsData];
      if (shuffle) {
        activeQuestions.sort(() => Math.random() - 0.5);
      }
      activeIndex = 0;
    }

    function onChapterChange() {
      const selectEl = document.getElementById('chapter-select');
      currentSelectedChapter = selectEl.value;
      activeQuestions = questionsData.filter(q => q.category === currentSelectedChapter);
      activeIndex = 0;
      renderSingleQuestionCard();
      renderPaletteGrid();
    }

    // ==========================================
    // RENDER SINGLE QUESTION CARD
    // ==========================================
    function renderSingleQuestionCard() {
      const qText = document.getElementById('q-text');
      const qCategory = document.getElementById('q-category-tag');
      const qIndex = document.getElementById('q-index-tag');
      const pageIndicator = document.getElementById('page-indicator');
      const optionsContainer = document.getElementById('options-container');
      const explanationBox = document.getElementById('explanation-box');
      const explanationText = document.getElementById('explanation-text');
      const btnBookmark = document.getElementById('btn-bookmark');

      if (!activeQuestions || activeQuestions.length === 0) {
        qCategory.innerText = "尚無題目";
        qIndex.innerText = "0 / 0";
        qText.innerText = getEmptyMessageForMode();
        optionsContainer.innerHTML = '';
        explanationBox.classList.add('hidden');
        pageIndicator.innerText = "0 / 0";
        btnBookmark.className = "p-2 text-slate-300 dark:text-slate-600 transition-colors";
        return;
      }

      const q = activeQuestions[activeIndex];
      const isBookmarked = bookmarkedQuestions.has(q.global_id);
      const userSelected = userAnswers[q.global_id];

      qCategory.innerText = q.category;
      qIndex.innerText = `題目編號 #${q.global_id}`;
      qText.innerText = q.question;
      pageIndicator.innerText = `${activeIndex + 1} / ${activeQuestions.length}`;

      // Bookmark Button Style
      btnBookmark.className = isBookmarked 
        ? "p-2 text-amber-500 dark:text-amber-400 transition-colors" 
        : "p-2 text-slate-300 dark:text-slate-600 hover:text-amber-500 dark:hover:text-amber-400 transition-colors";

      // Options List Render
      optionsContainer.innerHTML = '';
      Object.keys(q.options).forEach(optKey => {
        const optionBtn = document.createElement('button');
        optionBtn.onclick = () => handleSelectOption(optKey);
        
        let stateStyles = "bg-slate-50 dark:bg-slate-700/50 border-slate-200 dark:border-slate-600 text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700";
        let badgeStyles = "bg-white dark:bg-slate-600 border-slate-200 dark:border-slate-500 text-slate-500 dark:text-slate-300";

        if (userSelected) {
          if (optKey === q.answer) {
            stateStyles = "bg-emerald-50 dark:bg-emerald-900/30 border-emerald-500 text-emerald-800 dark:text-emerald-300 font-bold";
            badgeStyles = "bg-emerald-500 text-white border-emerald-500";
          } else if (optKey === userSelected) {
            stateStyles = "bg-rose-50 dark:bg-rose-900/30 border-rose-500 text-rose-800 dark:text-rose-300 font-bold";
            badgeStyles = "bg-rose-500 text-white border-rose-500";
          } else {
            stateStyles = "bg-slate-50 dark:bg-slate-700/30 border-slate-200 dark:border-slate-700/50 text-slate-400 dark:text-slate-500 opacity-60";
          }
        }

        optionBtn.className = `w-full p-3.5 rounded-xl border text-left flex items-start space-x-3 transition-all ${stateStyles}`;
        optionBtn.innerHTML = `
          <span class="w-6 h-6 rounded-lg border text-xs flex items-center justify-center font-bold shrink-0 mt-0.5 ${badgeStyles}">${optKey}</span>
          <span class="text-xs sm:text-sm leading-snug">${q.options[optKey]}</span>
        `;
        optionsContainer.appendChild(optionBtn);
      });

      // Show/Hide Explanation
      if (userSelected) {
        explanationText.innerText = q.explanation;
        explanationBox.classList.remove('hidden');
      } else {
        explanationBox.classList.add('hidden');
      }
    }

    function getEmptyMessageForMode() {
      if (currentQuizMode === 'wrong') return "🎉 太棒了！目前尚無錯題紀錄！";
      if (currentQuizMode === 'bookmarks') return "⭐ 目前收藏夾為空，在練習時點擊星號可新增收藏。";
      return "目前沒有可顯示的題目。";
    }

    // Handle Option Selection
    function handleSelectOption(optKey) {
      if (!activeQuestions || activeQuestions.length === 0) return;
      const q = activeQuestions[activeIndex];
      
      userAnswers[q.global_id] = optKey;

      if (optKey !== q.answer) {
        wrongAnswers.add(q.global_id);
      } else {
        wrongAnswers.delete(q.global_id);
      }

      saveUserData();
      renderSingleQuestionCard();
      renderPaletteGrid();
      updateStatsUI();
    }

    // Pagination Controls
    function nextQuestion() {
      if (activeIndex < activeQuestions.length - 1) {
        activeIndex++;
        renderSingleQuestionCard();
        renderPaletteGrid();
      }
    }

    function prevQuestion() {
      if (activeIndex > 0) {
        activeIndex--;
        renderSingleQuestionCard();
        renderPaletteGrid();
      }
    }

    function toggleBookmarkCurrent() {
      if (!activeQuestions || activeQuestions.length === 0) return;
      const q = activeQuestions[activeIndex];
      
      if (bookmarkedQuestions.has(q.global_id)) {
        bookmarkedQuestions.delete(q.global_id);
      } else {
        bookmarkedQuestions.add(q.global_id);
      }

      saveUserData();
      renderSingleQuestionCard();
      updateStatsUI();

      if (currentQuizMode === 'bookmarks') {
        activeQuestions = questionsData.filter(item => bookmarkedQuestions.has(item.global_id));
        if (activeIndex >= activeQuestions.length) {
          activeIndex = Math.max(0, activeQuestions.length - 1);
        }
        renderSingleQuestionCard();
        renderPaletteGrid();
      }
    }

    // ==========================================
    // QUESTION PALETTE (RIGHT SIDEBAR)
    // ==========================================
    function renderPaletteGrid() {
      const paletteGrid = document.getElementById('palette-grid');
      const paletteCountInfo = document.getElementById('palette-count-info');

      paletteCountInfo.innerText = `共 ${activeQuestions.length} 題`;
      paletteGrid.innerHTML = '';

      if (activeQuestions.length === 0) {
        paletteGrid.innerHTML = `<div class="col-span-full text-center py-4 text-xs text-slate-400">無資料</div>`;
        return;
      }

      activeQuestions.forEach((q, idx) => {
        const btn = document.createElement('button');
        btn.onclick = () => {
          activeIndex = idx;
          renderSingleQuestionCard();
          renderPaletteGrid();
        };

        const uAns = userAnswers[q.global_id];
        let bgStyle = "bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-600";
        
        if (uAns) {
          if (uAns === q.answer) {
            bgStyle = "bg-emerald-500 text-white";
          } else {
            bgStyle = "bg-rose-500 text-white";
          }
        }

        const isCurrent = idx === activeIndex;
        const borderStyle = isCurrent ? "ring-2 ring-brand-500 ring-offset-2 dark:ring-offset-slate-800" : "";

        btn.className = `h-9 w-full rounded-lg text-xs font-bold transition-all flex items-center justify-center ${bgStyle} ${borderStyle}`;
        btn.innerText = idx + 1;
        paletteGrid.appendChild(btn);
      });
    }

    // ==========================================
    // MOCK EXAM ENGINE
    // ==========================================
    function startMockExam() {
      document.getElementById('mock-setup-screen').classList.add('hidden');
      document.getElementById('mock-result-screen').classList.add('hidden');
      document.getElementById('mock-active-screen').classList.remove('hidden');

      // Random sample up to 20 questions
      const shuffled = [...questionsData].sort(() => Math.random() - 0.5);
      mockExamQuestions = shuffled.slice(0, Math.min(20, shuffled.length));
      mockExamAnswers = {};

      mockTimeRemaining = 20 * 60;
      updateMockTimerUI();
      clearInterval(mockTimerInterval);
      mockTimerInterval = setInterval(() => {
        mockTimeRemaining--;
        updateMockTimerUI();
        if (mockTimeRemaining <= 0) {
          clearInterval(mockTimerInterval);
          alert("⏱️ 時間到！系統將自動提交答案。");
          submitMockExam();
        }
      }, 1000);

      renderMockQuestionsList();
    }

    function updateMockTimerUI() {
      const mins = Math.floor(mockTimeRemaining / 60);
      const secs = mockTimeRemaining % 60;
      setElText('mock-timer', `⏱️ ${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`);
    }

    function renderMockQuestionsList() {
      const container = document.getElementById('mock-questions-list');
      container.innerHTML = '';

      const answeredCount = Object.keys(mockExamAnswers).length;
      setElText('mock-progress', `已答 ${answeredCount} / ${mockExamQuestions.length} 題`);

      mockExamQuestions.forEach((q, idx) => {
        const item = document.createElement('div');
        item.className = "p-4 bg-slate-50 dark:bg-slate-700/40 border border-slate-200 dark:border-slate-700 rounded-xl space-y-3 transition-theme";

        let optionsHtml = '';
        Object.keys(q.options).forEach(optKey => {
          const isSelected = mockExamAnswers[q.global_id] === optKey;
          const optStyle = isSelected
            ? "bg-brand-50 dark:bg-brand-900/40 border-brand-500 text-brand-700 dark:text-brand-300 font-bold"
            : "bg-white dark:bg-slate-700 border-slate-200 dark:border-slate-600 text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-600";

          optionsHtml += `
            <button onclick="selectMockOption(${q.global_id}, '${optKey}')" class="w-full p-2.5 rounded-lg border text-left text-xs sm:text-sm flex items-center space-x-2 transition-all ${optStyle}">
              <span class="w-5 h-5 rounded border text-[11px] flex items-center justify-center font-bold shrink-0">${optKey}</span>
              <span>${q.options[optKey]}</span>
            </button>
          `;
        });

        item.innerHTML = `
          <div class="flex items-center space-x-2">
            <span class="px-2 py-0.5 bg-slate-200 dark:bg-slate-600 text-slate-700 dark:text-slate-200 rounded text-[11px] font-bold">第 ${idx + 1} 題</span>
            <span class="text-xs text-slate-400 dark:text-slate-500">（${q.category}）</span>
          </div>
          <p class="text-sm font-bold text-slate-800 dark:text-slate-100">${q.question}</p>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 pt-1">${optionsHtml}</div>
        `;
        container.appendChild(item);
      });
    }

    function selectMockOption(globalId, optKey) {
      mockExamAnswers[globalId] = optKey;
      renderMockQuestionsList();
    }

    function submitMockExam() {
      clearInterval(mockTimerInterval);

      let correctCount = 0;
      const total = mockExamQuestions.length;

      mockExamQuestions.forEach(q => {
        const userAns = mockExamAnswers[q.global_id];
        if (userAns) {
          userAnswers[q.global_id] = userAns;
          if (userAns === q.answer) {
            correctCount++;
            wrongAnswers.delete(q.global_id);
          } else {
            wrongAnswers.add(q.global_id);
          }
        }
      });

      saveUserData();
      updateStatsUI();

      const score = Math.round((correctCount / total) * 100);

      document.getElementById('mock-active-screen').classList.add('hidden');
      const resultScreen = document.getElementById('mock-result-screen');
      resultScreen.classList.remove('hidden');

      const isPass = score >= 60;

      resultScreen.innerHTML = `
        <div class="max-w-md mx-auto space-y-4">
          <div class="w-20 h-20 ${isPass ? 'bg-emerald-50 dark:bg-emerald-900/40 text-emerald-600 dark:text-emerald-400' : 'bg-rose-50 dark:bg-rose-900/40 text-rose-600 dark:text-rose-400'} rounded-full flex items-center justify-center text-4xl mx-auto shadow-inner">
            ${isPass ? '🏆' : '⚠️'}
          </div>
          <h2 class="text-2xl sm:text-3xl font-black text-slate-900 dark:text-white mb-1">測驗成績診斷報告</h2>
          <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400 mb-6">${isPass ? '合格！成績表現優異，請繼續保持！' : '未達及格標準（60分），建議複習弱點章節。'}</p>
          
          <div class="grid grid-cols-3 gap-3 max-w-md mx-auto mb-6">
            <div class="bg-slate-50 dark:bg-slate-700/50 p-3 rounded-xl border border-slate-200 dark:border-slate-600 transition-theme">
              <span class="text-[11px] text-slate-400 dark:text-slate-400 block mb-0.5">最終得分</span>
              <span class="text-xl sm:text-2xl font-black ${isPass ? 'text-emerald-600 dark:text-emerald-400' : 'text-rose-600 dark:text-rose-400'}">${score} <span class="text-xs">分</span></span>
            </div>
            <div class="bg-slate-50 dark:bg-slate-700/50 p-3 rounded-xl border border-slate-200 dark:border-slate-600 transition-theme">
              <span class="text-[11px] text-slate-400 dark:text-slate-400 block mb-0.5">答對題數</span>
              <span class="text-xl sm:text-2xl font-black text-emerald-600 dark:text-emerald-400">${correctCount} <span class="text-xs">/ ${total}</span></span>
            </div>
            <div class="bg-slate-50 dark:bg-slate-700/50 p-3 rounded-xl border border-slate-200 dark:border-slate-600 transition-theme">
              <span class="text-[11px] text-slate-400 dark:text-slate-400 block mb-0.5">答錯題數</span>
              <span class="text-xl sm:text-2xl font-black text-rose-600 dark:text-rose-400">${total - correctCount} <span class="text-xs">題</span></span>
            </div>
          </div>

          <div class="flex items-center justify-center space-x-3">
            <button onclick="showMockSetupView()" class="px-4 py-2 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 rounded-xl text-xs sm:text-sm font-bold transition-all">
              🔄 重新測驗
            </button>
            <button onclick="switchTab('quiz'); switchQuizMode('wrong');" class="px-4 py-2 bg-rose-600 hover:bg-rose-700 text-white rounded-xl text-xs sm:text-sm font-bold transition-all shadow">
              ❌ 檢視並練習錯題
            </button>
          </div>
        </div>
      `;
    }

    function showMockSetupView() {
      document.getElementById('mock-result-screen').classList.add('hidden');
      document.getElementById('mock-active-screen').classList.add('hidden');
      document.getElementById('mock-setup-screen').classList.remove('hidden');
    }

    // ==========================================
    // GLOBAL STATS UPDATE & RESET
    // ==========================================
    function updateStatsUI() {
      const answeredTotal = Object.keys(userAnswers).length;
      setElText('stat-answered', answeredTotal);

      let correctTotal = 0;
      Object.keys(userAnswers).forEach(gid => {
        const q = questionsData.find(item => item.global_id === parseInt(gid));
        if (q && userAnswers[gid] === q.answer) {
          correctTotal++;
        }
      });

      const accRate = answeredTotal > 0 ? Math.round((correctTotal / answeredTotal) * 100) : 0;
      setElText('stat-accuracy', `${accRate}%`);
      setElText('stat-wrong', wrongAnswers.size);
      setElText('stat-bookmarks', bookmarkedQuestions.size);

      setElText('badge-wrong-count', wrongAnswers.size);
      setElText('badge-bookmark-count', bookmarkedQuestions.size);
    }

    function resetAllProgress() {
      if (confirm("⚠️ 確定要重置所有做題紀錄、錯題本與收藏嗎？此動作無法復原。")) {
        userAnswers = {};
        wrongAnswers.clear();
        bookmarkedQuestions.clear();
        saveUserData();
        reshuffleRandomQuestions(false);
        renderSingleQuestionCard();
        renderPaletteGrid();
        alert("所有練習紀錄已順利重置！");
      }
    }

    // Keyboard Shortcuts Navigation
    document.addEventListener('keydown', (e) => {
      if (['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName)) return;

      if (currentTab === 'quiz') {
        const key = e.key.toUpperCase();
        if (['A', 'B', 'C', 'D'].includes(key)) {
          handleSelectOption(key);
        } else if (e.key === 'ArrowRight' || e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          nextQuestion();
        } else if (e.key === 'ArrowLeft') {
          e.preventDefault();
          prevQuestion();
        }
      }
    });
  </script>
</body>
</html>

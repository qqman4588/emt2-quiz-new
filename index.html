<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMT-2 題庫測驗系統</title>
    <!-- 引入題庫與渲染工具 (全部指向你 GitHub 裡的實體檔案) -->
    <script src="marked.min.js"></script>
    <script src="data.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        h1 { font-size: 20px; text-align: center; color: #32e6e2; }
        .question { font-size: 16px; margin-bottom: 15px; }
        .options button {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            background: #2a2a2a;
            color: #fff;
            border: 1px solid #444;
            border-radius: 8px;
            text-align: left;
            font-size: 15px;
        }
        .options button:active { background: #05bdba; }
        .next-btn {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            background: #05bdba;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            color: #000;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>EMT-2 題庫自主測驗</h1>
        <div id="quiz-box">
            <div id="question" class="question">載入題庫中...</div>
            <div id="options" class="options"></div>
            <button id="next-btn" class="next-btn" onclick="nextQuestion()" style="display:none;">下一題</button>
        </div>
    </div>

    <script>
        let currentIndex = 0;

        function loadQuestion() {
            if (typeof quizData === 'undefined' && typeof questions === 'undefined' && typeof data === 'undefined') {
                document.getElementById('question').innerText = "已讀取主頁面！正在串接 848KB 題庫中...";
                return;
            }
            // 自動適應題庫變數
            let list = window.quizData || window.questions || window.data;
            if (!list || list.length === 0) {
                document.getElementById('question').innerText = "未找到題目資料，請確認 data.js 內容。";
                return;
            }
            let q = list[currentIndex];
            document.getElementById('question').innerText = (currentIndex + 1) + ". " + (q.question || q.q);
            let optsHtml = "";
            let options = q.options || q.opts || [];
            options.forEach((opt, idx) => {
                optsHtml += `<button onclick="checkAnswer(${idx})">${opt}</button>`;
            });
            document.getElementById('options').innerHTML = optsHtml;
            document.getElementById('next-btn').style.display = 'none';
        }

        function checkAnswer(idx) {
            alert("已選擇選項 " + (idx + 1));
            document.getElementById('next-btn').style.display = 'block';
        }

        function nextQuestion() {
            currentIndex++;
            loadQuestion();
        }

        window.onload = loadQuestion;
    </script>
</body>
</html>

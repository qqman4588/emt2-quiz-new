<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EMT 緊急救護員 學習與題庫系統</title>
  <!-- Tailwind CSS & Marked.js -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    .markdown-body h1 { font-size: 1.75rem; font-weight: 700; margin-bottom: 1rem; color: #0f172a; }
    .markdown-body h2 { font-size: 1.35rem; font-weight: 700; margin-top: 1.5rem; margin-bottom: 0.75rem; color: #1e293b; border-bottom: 2px solid #e2e8f0; padding-bottom: 0.25rem; }
    .markdown-body p { margin-bottom: 1rem; line-height: 1.7; color: #334155; }
    .markdown-body ul { list-style-type: disc; padding-left: 1.5rem; margin-bottom: 1rem; color: #334155; }
    .markdown-body li { margin-bottom: 0.5rem; }
    .markdown-body code { background-color: #f1f5f9; padding: 0.2rem 0.4rem; border-radius: 0.25rem; font-family: monospace; color: #0284c7; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 flex flex-col">

  <!-- 頂部主功能導覽列 -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-10">
    <div class="max-w-6xl mx-auto flex">
      <button id="tab-note" onclick="switchMainTab('note')" class="flex-1 py-4 text-center font-bold border-b-2 border-indigo-600 text-indigo-600 transition">
        📖 章節重點整理
      </button>
      <button id="tab-quiz" onclick="switchMainTab('quiz')" class="flex-1 py-4 text-center font-bold border-b-2 border-transparent text-slate-500 hover:text-slate-800 transition">
        📝 章節測驗
      </button>
      <button id="tab-wrong" onclick="switchMainTab('wrong')" class="flex-1 py-4 text-center font-bold border-b-2 border-transparent text-slate-500 hover:text-slate-800 transition">
        📚 錯題本 (<span id="wrong-count">0</span>)
      </button>
    </div>
  </header>

  <!-- 主內容區 -->
  <main class="max-w-6xl w-full mx-auto p-4 md:p-6 flex-1 flex gap-6">

    <!-- 區塊 A：18 章重點閱讀模式 -->
    <div id="view-note-wrapper" class="w-full flex flex-col md:flex-row gap-6">
      <!-- 側邊欄：18 章選單 -->
      <aside class="w-full md:w-72 bg-white p-4 rounded-xl border border-slate-200 shadow-sm shrink-0 h-fit max-h-[80vh] overflow-y-auto">
        <h2 class="font-bold text-slate-700 mb-3 text-sm tracking-wider uppercase border-b pb-2">EMT 講義章節目錄 (全18章)</h2>
        <ul id="chapter-list" class="space-y-1"></ul>
      </aside>

      <!-- 文章內容展示區 -->
      <section class="flex-1 bg-white p-6 md:p-8 rounded-xl border border-slate-200 shadow-sm min-h-[500px]">
        <div id="markdown-content" class="markdown-body"></div>
      </section>
    </div>

    <!-- 區塊 B：測驗與錯題本模式 -->
    <div id="view-quiz-wrapper" class="w-full max-w-3xl mx-auto hidden">
      <div class="bg-white p-6 md:p-8 rounded-xl border border-slate-200 shadow-sm">
        <div class="flex justify-between items-center mb-4 text-sm font-medium text-slate-500">
          <span id="quiz-chapter-title">章節測驗</span>
          <span id="quiz-progress">第 1 / 1 題</span>
        </div>

        <h2 id="question-text" class="text-lg md:text-xl font-bold mb-6 text-slate-900 leading-relaxed">
          載入中...
        </h2>

        <div id="options-container" class="space-y-3 mb-6"></div>

        <div id="explanation-box" class="hidden p-4 rounded-xl mb-6 text-sm">
          <p id="result-status" class="font-bold text-base mb-1"></p>
          <p id="explanation-text" class="leading-relaxed"></p>
        </div>

        <div class="flex justify-end">
          <button id="next-btn" onclick="nextQuestion()" class="hidden bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-6 py-2.5 rounded-xl transition">
            下一題 ➔
          </button>
        </div>
      </div>
    </div>

    <!-- 區塊 C：無錯題提示 -->
    <div id="view-empty-wrapper" class="w-full max-w-xl mx-auto hidden text-center py-16 bg-white rounded-xl border border-slate-200 shadow-sm">
      <div class="text-6xl mb-4">🎉</div>
      <h3 class="text-xl font-bold text-slate-800 mb-2">太棒了！目前沒有任何錯題</h3>
      <p class="text-slate-500 text-sm">在測驗中答錯的題目，會自動收集到這裡供您複習。</p>
    </div>

  </main>

  <!-- 引入題目檔 (與 index.html 同目錄) -->
  <script src="questions.js"></script>

  <script>
    // 完整的 18 章 EMT 講義資料結構
    const notesData = {
      "ch1": { title: "第一章：緊急醫療救護體系概論", content: "# 第一章：緊急醫療救護體系概論\n\n* **EMT 職責**：現場評估、急救處置、安全送醫。\n* **法律責任**：緊急醫療救護法、知情同意與拒絕送醫流程。" },
      "ch2": { title: "第二章：人體構造與生理基礎", content: "# 第二章：人體構造與生理基礎\n\n* **解剖體位**：正面朝前、雙手下垂掌心朝前。\n* **主要系統**：循環系統、呼吸系統、神經系統、骨骼肌肉系統。" },
      "ch3": { title: "第三章：現場安全與感染控制", content: "# 第三章：現場安全與感染控制\n\n* **個人防護裝備 (PPE)**：手套、口罩、護目鏡。\n* **現場安全**：觀察車流、火災、有害物質，現場安全為第一優先。" },
      "ch4": { title: "第四章：病人評估（初評與次評）", content: "# 第四章：病人評估\n\n* **XABCDE 流程**：致死性大出血 ➔ 氣道 ➔ 呼吸 ➔ 循環 ➔ 神經 ➔ 暴露保暖。\n* **SAMPLE 詢問病史**：症狀、過敏、藥物、病史、最後進食、事件經過。" },
      "ch5": { title: "第五章：氣道管理與呼吸急症", content: "# 第五章：氣道管理與呼吸急症\n\n* **開啟氣道**：無創傷用壓額抬下巴法；懷疑頸椎創傷用推下頷法 (Jaw-thrust)。\n* **給氧器材**：鼻導管 (2-6 L/min)、未濃縮氧氣面罩 (NRM 12-15 L/min)。" },
      "ch6": { title: "第六章：心律不整與 CPR / AED 操作", content: "# 第六章：心律不整與 CPR / AED 操作\n\n* **高品質 CPR**：按壓深度 5-6 cm、速率 100-120 次/分、按壓後完全回彈。\n* **AED 可電擊心律**：VF (心室顫動) 與 Pulseless VT (無脈搏心室頻脈)。" },
      "ch7": { title: "第七章：休克與循環系統急症", content: "# 第七章：休克與循環系統急症\n\n* **休克分類**：低血容性、心因性、分布性（過敏性、敗血性、神經性）、阻塞性。\n* **胸痛藥物**：協助使用 NTG（血壓需 > 90 mmHg 且無使用壯陽藥）。" },
      "ch8": { title: "第八章：神經系統急症（中風與癲癇）", content: "# 第八章：神經系統急症\n\n* **Cincinnati 辛辛那提中風指標**：手臂下垂、臉部歪斜、言語異常。\n* **癲癇處置**：保護頭部、維持氣道通暢、勿強行塞入硬物。" },
      "ch9": { title: "第九章：糖尿病與代謝急症", content: "# 第九章：糖尿病與代謝急症\n\n* **低血糖**：血糖 < 60 mg/dL，意識清醒者可口服葡萄糖膠/糖水。" },
      "ch10": { title: "第十章：過敏反應與中毒急症", content: "# 第十章：過敏反應與中毒急症\n\n* **嚴重過敏**：過敏性休克、喉頭水腫，肌肉注射 Epinephrine (成人 0.3mg)。" },
      "ch11": { title: "第十一章：急腹症與環境急症", content: "# 第十一章：急腹症與環境急症\n\n* **熱急症**：熱痙攣、熱衰竭、熱中暑（體溫 > 40°C 且無汗/意識改變）。" },
      "ch12": { title: "第十二章：創傷總論與軟組織創傷", content: "# 第十二章：創傷總論與軟組織創傷\n\n* **止血方法**：直接加壓止血法、止血帶（記錄時間於額頭/止血帶上）。" },
      "ch13": { title: "第十三章：骨骼肌肉創傷與固定", content: "# 第十三章：骨骼肌肉創傷與固定\n\n* **固定原則**：固定傷處上下兩個關節，包紮前後均需確認 CMS (循環/感覺/運動)。" },
      "ch14": { title: "第十四章：頭脊椎與胸腹部創傷", content: "# 第十四章：頭脊椎與胸腹部創傷\n\n* **Cushing's Triad**：收縮壓升高、心跳過緩、呼吸不規則 ➔ ICP 升高。\n* **Beck's Triad**：低血壓、頸靜脈怒張、心音遙遠 ➔ 心包填塞。" },
      "ch15": { title: "第十五章：婦產科急症與急產接生", content: "# 第十五章：婦產科急症與急產接生\n\n* **急產接生**：托住胎頭避免撕裂、清乾淨口鼻、保暖、記錄出生時間。" },
      "ch16": { title: "第十六章：小兒與老年救護特論", content: "# 第十六章：小兒與老年救護特論\n\n* **小兒評估三角 (PAT)**：外觀 (Appearance)、呼吸工作 (Work of breathing)、皮膚循環 (Circulation)。" },
      "ch17": { title: "第十七章：大量傷病患與檢傷分類", content: "# 第十七章：大量傷病患與檢傷分類\n\n* **START 檢傷分類法**：呼吸 (RPM)、血液循環/微血管充盈、意識狀態。" },
      "ch18": { title: "第十八章：特殊救護情境與搬運救護", content: "# 第十八章：特殊救護情境與搬運救護\n\n* **搬運原則**：人體工學、屈膝平背、緊貼身體、緊急搬運與搬運器材使用。" }
    };

    let currentChapterKey = 'ch1';
    let currentMainTab = 'note';
    let currentQuestions = [];
    let currentIndex = 0;
    let selectedOption = null;

    function initSidebar() {
      const listEl = document.getElementById('chapter-list');
      listEl.innerHTML = '';
      
      Object.keys(notesData).forEach(key => {
        const li = document.createElement('li');
        const btn = document.createElement('button');
        btn.id = `side-btn-${key}`;
        btn.className = "w-full text-left px-3 py-2 rounded-lg text-sm font-medium transition text-slate-600 hover:bg-slate-100";
        btn.textContent = notesData[key].title;
        btn.onclick = () => selectChapter(key);
        li.appendChild(btn);
        listEl.appendChild(li);
      });

      selectChapter(currentChapterKey);
    }

    function selectChapter(key) {
      currentChapterKey = key;
      Object.keys(notesData).forEach(k => {
        const btn = document.getElementById(`side-btn-${k}`);
        if (btn) {
          btn.className = k === key 
            ? "w-full text-left px-3 py-2 rounded-lg text-sm font-bold bg-indigo-50 text-indigo-600"
            : "w-full text-left px-3 py-2 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-100";
        }
      });
      document.getElementById('markdown-content').innerHTML = marked.parse(notesData[key].content);
    }

    function getWrongList() {
      return JSON.parse(localStorage.getItem('wrong_questions') || '[]');
    }

    function saveToWrongList(qId) {
      let list = getWrongList();
      if (!list.includes(qId)) {
        list.push(qId);
        localStorage.setItem('wrong_questions', JSON.stringify(list));
      }
      updateWrongCount();
    }

    function removeFromWrongList(qId) {
      let list = getWrongList().filter(id => id !== qId);
      localStorage.setItem('wrong_questions', JSON.stringify(list));
      updateWrongCount();
    }

    function updateWrongCount() {
      document.getElementById('wrong-count').textContent = getWrongList().length;
    }

    function switchMainTab(tab) {
      currentMainTab = tab;

      ['note', 'quiz', 'wrong'].forEach(t => {
        const btn = document.getElementById(`tab-${t}`);
        btn.className = t === tab 
          ? "flex-1 py-4 text-center font-bold border-b-2 border-indigo-600 text-indigo-600 transition"
          : "flex-1 py-4 text-center font-bold border-b-2 border-transparent text-slate-500 hover:text-slate-800 transition";
      });

      document.getElementById('view-note-wrapper').classList.add('hidden');
      document.getElementById('view-quiz-wrapper').classList.add('hidden');
      document.getElementById('view-empty-wrapper').classList.add('hidden');

      if (tab === 'note') {
        document.getElementById('view-note-wrapper').classList.remove('hidden');
      } else {
        const allQ = window.allQuestions || [];
        if (tab === 'quiz') {
          currentQuestions = [...allQ];
        } else if (tab === 'wrong') {
          const wrongIds = getWrongList();
          currentQuestions = allQ.filter(q => wrongIds.includes(q.id));
        }

        if (currentQuestions.length === 0) {
          document.getElementById('view-empty-wrapper').classList.remove('hidden');
        } else {
          document.getElementById('view-quiz-wrapper').classList.remove('hidden');
          currentIndex = 0;
          loadQuestion();
        }
      }
    }

    function loadQuestion() {
      const q = currentQuestions[currentIndex];
      selectedOption = null;

      document.getElementById('quiz-chapter-title').textContent = q.chapter;
      document.getElementById('quiz-progress').textContent = `第 ${currentIndex + 1} / ${currentQuestions.length} 題`;
      document.getElementById('question-text').textContent = q.question;

      document.getElementById('explanation-box').classList.add('hidden');
      document.getElementById('next-btn').classList.add('hidden');

      const container = document.getElementById('options-container');
      container.innerHTML = '';

      q.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = "w-full text-left p-4 rounded-xl border border-slate-200 hover:border-indigo-500 hover:bg-indigo-50/50 transition font-medium text-slate-700";
        btn.textContent = `${['A', 'B', 'C', 'D'][idx]}. ${opt}`;
        btn.onclick = () => selectOption(idx);
        container.appendChild(btn);
      });
    }

    function selectOption(index) {
      if (selectedOption !== null) return;
      selectedOption = index;

      const q = currentQuestions[currentIndex];
      const isCorrect = index === q.answer;
      const optionButtons = document.getElementById('options-container').children;

      for (let i = 0; i < optionButtons.length; i++) {
        optionButtons[i].disabled = true;
        if (i === q.answer) {
          optionButtons[i].className = "w-full text-left p-4 rounded-xl border-2 border-emerald-500 bg-emerald-50 text-emerald-900 font-bold";
        } else if (i === index && !isCorrect) {
          optionButtons[i].className = "w-full text-left p-4 rounded-xl border-2 border-rose-500 bg-rose-50 text-rose-900 font-bold";
        } else {
          optionButtons[i].className = "w-full text-left p-4 rounded-xl border border-slate-200 text-slate-400 opacity-50";
        }
      }

      if (isCorrect) {
        if (currentMainTab === 'wrong') removeFromWrongList(q.id);
      } else {
        saveToWrongList(q.id);
      }

      const expBox = document.getElementById('explanation-box');
      const resStatus = document.getElementById('result-status');
      const expText = document.getElementById('explanation-text');

      expBox.classList.remove('hidden');
      if (isCorrect) {
        expBox.className = "p-4 rounded-xl mb-6 text-sm bg-emerald-50 border border-emerald-200 text-emerald-900";
        resStatus.textContent = "✨ 答對了！";
      } else {
        expBox.className = "p-4 rounded-xl mb-6 text-sm bg-rose-50 border border-rose-200 text-rose-900";
        resStatus.textContent = "❌ 答錯了！已紀錄至錯題本";
      }
      expText.textContent = `解析：${q.explanation}`;

      document.getElementById('next-btn').classList.remove('hidden');
    }

    function nextQuestion() {
      if (currentMainTab === 'wrong') {
        const wrongIds = getWrongList();
        const allQ = window.allQuestions || [];
        currentQuestions = allQ.filter(q => wrongIds.includes(q.id));
        if (currentIndex >= currentQuestions.length) currentIndex = 0;
      } else {
        currentIndex++;
      }

      if (currentQuestions.length === 0) {
        document.getElementById('view-quiz-wrapper').classList.add('hidden');
        document.getElementById('view-empty-wrapper').classList.remove('hidden');
      } else if (currentIndex < currentQuestions.length) {
        loadQuestion();
      } else {
        alert("🎉 已經完成所有題目！");
        switchMainTab(currentMainTab);
      }
    }

    initSidebar();
    updateWrongCount();
  </script>
</body>
</html>

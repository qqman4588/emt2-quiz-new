<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMT-2 題庫測驗系統</title>
    <script src="marked.min.js"></script>
    <script src="data.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
        }
        .container {
            max-width: 650px;
            width: 100%;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        h1 { font-size: 20px; text-align: center; color: #32e6e2; margin-top: 0; }
        select {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            background: #2a2a2a;
            color: #fff;
            border: 1px solid #05bdba;
            border-radius: 8px;
            font-size: 15px;
        }
        .markdown-body {
            line-height: 1.6;
            font-size: 15px;
            word-break: break-word;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>EMT-2 題庫自主測驗系統</h1>
        <select id="chapter-select" onchange="switchChapter()">
            <option value="">載入章節中...</option>
        </select>
        <div id="content" class="markdown-body">正在載入題庫內容...</div>
    </div>

    <script>
        function initApp() {
            if (!window.EMT2_DATA || !window.EMT2_DATA.chapters) {
                document.getElementById('content').innerText = "錯誤：無法讀取 EMT2_DATA，請確認 data.js 是否存在且載入正確。";
                return;
            }

            let chapters = window.EMT2_DATA.chapters;
            let select = document.getElementById('chapter-select');
            select.innerHTML = "";

            chapters.forEach((ch, index) => {
                let opt = document.createElement('option');
                opt.value = index;
                opt.innerText = ch.title || (`第 ${ch.chapter_num} 章 (${ch.question_count}題)`);
                select.appendChild(opt);
            });

            switchChapter();
        }

        function switchChapter() {
            let index = document.getElementById('chapter-select').value;
            if (index === "") return;
            
            let ch = window.EMT2_DATA.chapters[index];
            let rawMd = ch.notes_markdown || "本章節無內容";

            if (typeof marked !== 'undefined') {
                document.getElementById('content').innerHTML = marked.parse(rawMd);
            } else {
                document.getElementById('content').innerText = rawMd;
            }
        }

        window.onload = initApp;
    </script>
</body>
</html>
